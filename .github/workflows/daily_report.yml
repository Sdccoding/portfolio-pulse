name: Daily Portfolio Update

on:
  schedule:
    # 02:30 UTC is exactly 08:00 AM IST
    # GitHub Actions uses UTC time exclusively.
    - cron: '30 2 * * *'
  workflow_dispatch: # This allows you to trigger it manually from the GitHub UI

jobs:
  run-portfolio-manager:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches a stable environment for Gemini libraries

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Script
        env:
          # Mapping GitHub Secrets to Environment Variables
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
